<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>MIDI API Advanced Playground</title>
    <style>
        :root { --accent: #54B76E; --bg: #0e1217; --panel: #1c1f26; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #ececec; padding: 20px; line-height: 1.5; }
        .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 380px 1fr; gap: 20px; }
        .box { background: var(--panel); padding: 20px; border-radius: 12px; border: 1px solid #333; margin-bottom: 20px; }
        h2 { margin-top: 0; color: var(--accent); font-size: 1.1rem; border-bottom: 1px solid #333; padding-bottom: 10px; }
        label { display: block; margin: 12px 0 5px; font-size: 0.85rem; color: #aaa; }
        input, select, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #0e1217; color: white; box-sizing: border-box; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #0e1217; padding: 10px; border-radius: 6px; border: 1px solid #333; }
        .checkbox-group label { display: flex; align-items: center; margin: 0; color: white; cursor: pointer; }
        .checkbox-group input { width: auto; margin-right: 8px; }
        button { background: var(--accent); color: white; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; margin-top: 15px; }
        button:hover { filter: brightness(1.1); transform: translateY(-1px); }
        #console { background: #000; color: #00ff00; font-family: 'Fira Code', monospace; height: 450px; overflow-y: auto; padding: 15px; font-size: 0.8rem; border: 1px solid #444; border-radius: 8px; white-space: pre-wrap; }
        .badge { background: #333; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; margin-left: 5px; }
    </style>
</head>
<body>

<h1>🎹 MIDI API Playground <span style="font-size: 0.5em; vertical-align: middle; opacity: 0.6;">v1.2</span></h1>

<div class="container">
    <div class="sidebar">
        <div class="box">
            <h2>🔑 Authentication</h2>
            <label>API Key (mgk_...)</label>
            <input type="text" id="apiKey" placeholder="Επικόλλησε το κλειδί σου">
            <button style="background: #333;" onclick="validate()">Έλεγχος Status</button>
            <div id="valStatus" style="margin-top:10px; font-size:0.8rem;"></div>
        </div>

        <div class="box">
            <h2>⚙️ Parameters</h2>
            
            <div class="grid-2">
                <div>
                    <label>Style</label>
                    <select id="style">
                        <option value="techno">Techno</option>
                        <option value="house">House</option>
                        <option value="melodic-techno">Melodic Techno</option>
                        <option value="synthwave">Synthwave</option>
                        <option value="trap">Trap</option>
                        <option value="lo-fi">Lo-Fi</option>
                        <option value="trance">Trance</option>
                        <option value="ambient">Ambient</option>
                    </select>
                </div>
                <div>
                    <label>Mood</label>
                    <select id="mood">
                        <option value="dark">Dark</option>
                        <option value="dreamy">Dreamy</option>
                        <option value="uplifting">Uplifting</option>
                        <option value="mysterious">Mysterious</option>
                        <option value="groovy">Groovy</option>
                        <option value="energetic">Energetic</option>
                        <option value="melancholic">Melancholic</option>
                        <option value="aggressive">Aggressive</option>
                    </select>
                </div>
            </div>

            <div class="grid-2">
                <div>
                    <label>Key</label>
                    <select id="key">
                        <option value="C">C</option><option value="C#">C#</option><option value="D">D</option>
                        <option value="Eb">Eb</option><option value="E">E</option><option value="F">F</option>
                        <option value="G">G</option><option value="A">A</option><option value="Bb">Bb</option>
                    </select>
                </div>
                <div>
                    <label>Scale</label>
                    <select id="scale">
                        <option value="minor">Minor</option>
                        <option value="major">Major</option>
                        <option value="dorian">Dorian</option>
                        <option value="phrygian">Phrygian</option>
                        <option value="pentatonic">Pentatonic</option>
                        <option value="blues">Blues</option>
                    </select>
                </div>
            </div>

            <div class="grid-2">
                <div>
                    <label>BPM</label>
                    <input type="number" id="bpm" value="124" min="60" max="200">
                </div>
                <div>
                    <label>Bars</label>
                    <input type="number" id="bars" value="4" min="1" max="8">
                </div>
            </div>

            <label>Tracks to Generate</label>
            <div class="checkbox-group">
                <label><input type="checkbox" class="trackType" value="bassline" checked> Bassline</label>
                <label><input type="checkbox" class="trackType" value="melody" checked> Melody</label>
                <label><input type="checkbox" class="trackType" value="keys"> Keys</label>
                <label><input type="checkbox" class="trackType" value="percussion"> Percussion</label>
            </div>

            <label>Output Format</label>
            <select id="format">
                <option value="json">JSON (Stream)</option>
                <option value="midi">Direct .MID File</option>
            </select>

            <button onclick="generate()">GENERATE MIDI</button>
        </div>
    </div>

    <div class="main">
        <div class="box" style="height: 100%;">
            <h2>🖥️ API Response</h2>
            <div id="console">Έτοιμος για την πρώτη κλήση...</div>
            <div id="downloadArea" style="margin-top: 15px; display: none;">
                <a id="midiLink" href="#" style="color: var(--accent); font-weight: bold; text-decoration: underline;">⬇️ Κατέβασμα αρχείου Generated_Track.mid</a>
            </div>
        </div>
    </div>
</div>

<script>
    const log = (msg, isError = false) => {
        const cons = document.getElementById('console');
        if (cons.innerText.includes('Έτοιμος')) cons.innerText = '';
        const color = isError ? '#ff4444' : '#00ff00';
        cons.innerHTML += `<span style="color: ${color}">${msg}</span>\n`;
        cons.scrollTop = cons.scrollHeight;
    };

    async function validate() {
        const key = document.getElementById('apiKey').value;
        const statusDiv = document.getElementById('valStatus');
        try {
            const res = await fetch('/api/keys/validate', {
                headers: { 'Authorization': `Bearer ${key}` }
            });
            const data = await res.json();
            if (res.ok) {
                statusDiv.innerHTML = `✅ OK! <span class="badge">${data.plan}</span><br>Credits: ${data.used}/${data.monthlyLimit}`;
            } else {
                statusDiv.innerHTML = `❌ Σφάλμα: ${data.error}`;
            }
        } catch (e) { statusDiv.innerHTML = "Σφάλμα σύνδεσης."; }
    }

    async function generate() {
        const key = document.getElementById('apiKey').value;
        const format = document.getElementById('format').value;
        const downloadArea = document.getElementById('downloadArea');
        downloadArea.style.display = 'none';

        if (!key) return alert('Βάλε το API Key!');

        // Συλλογή Track Types
        const tracks = Array.from(document.querySelectorAll('.trackType:checked')).map(cb => cb.value);

        const payload = {
            promptParams: {
                style: document.getElementById('style').value,
                mood: document.getElementById('mood').value,
                bpm: parseInt(document.getElementById('bpm').value),
                duration_bars: parseInt(document.getElementById('bars').value),
                key: document.getElementById('key').value,
                scale: document.getElementById('scale').value,
                trackTypes: tracks
            }
        };

        log(`>>> Calling POST /api/v1/midi?format=${format}...`);

        try {
            const res = await fetch(`/api/v1/midi?format=${format}`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${key}`
                },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                const err = await res.json();
                log(`Error: ${err.error}`, true);
                return;
            }

            // Χειρισμός MIDI αρχείου
            if (format === 'midi') {
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.getElementById('midiLink');
                a.href = url;
                a.download = `generated_${payload.promptParams.style}.mid`;
                downloadArea.style.display = 'block';
                log('Success: Λήφθηκε binary MIDI αρχείο.');
                return;
            }

            // Χειρισμός Streaming JSON
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            document.getElementById('console').innerText = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value);
                document.getElementById('console').innerText += chunk;
            }
            log('\n\n>>> Generation Complete.');

        } catch (e) {
            log('Fatal Error: ' + e.message, true);
        }
    }
</script>

</body>
</html>
