<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIDI API Advanced Playground</title>
  <style>
    
    :root {
      --bg: #0f1115; --surface: #1a1d24; --border: #2a2e38;
      --accent: #6d5dfc; --accent-hover: #5a4bd6; --text: #e2e4ea;
      --muted: #8b8e99; --success: #10b981; --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; padding: 2rem; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
    .field label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.3rem; }
    .field input, .field select, .field textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); padding: 0.6rem; border-radius: 8px; font-size: 0.9rem;
    }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
    .checkboxes { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.5rem; }
    .checkboxes label {
      display: flex; align-items: center; gap: 0.3rem; background: var(--bg);
      padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; font-size: 0.85rem;
    }
    .checkboxes input:checked + span { color: var(--accent); }
    .checkboxes input[type="checkbox"] { accent-color: var(--accent); }
    .btn {
      background: var(--accent); color: white; border: none; padding: 0.8rem 1.5rem;
      border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; width: 100%; margin-top: 1rem;
    }
    .btn:hover:not(:disabled) { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .actions { display: flex; gap: 1rem; margin-top: 0.5rem; }
    #responseArea pre {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 1rem; min-height: 150px; max-height: 400px; overflow-y: auto;
      font-family: 'Courier New', monospace; font-size: 0.85rem; white-space: pre-wrap;
    }
    .status { font-size: 0.85rem; color: var(--muted); margin-top: 0.5rem; }
    .status.error { color: var(--error); }
    .status.success { color: var(--success); }
    .tag { background: var(--border); color: var(--muted); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
    #dlLink { display: none; margin-top: 0.5rem; color: var(--accent); text-decoration: none; font-weight: 600; }
    #dlLink::before { content: "⬇️ "; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎹 MIDI API Playground <span class="tag">v1.3</span></h1>

    <div class="card">
      <div class="grid">
        <div class="field" style="grid-column: span 2;">
          <label>🔑 API Key (Bearer)</label>
          <input type="password" id="apiKey" placeholder="mgk_..." autocomplete="off">
          <div style="margin-top:.85rem;padding:.85rem;border:1px solid var(--border);border-radius:8px;">
            <div style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;">
              <button type="button" class="btn secondary" id="connectPollinations" style="width:auto;margin:0;">🌼 Connect Pollinations</button>
              <button type="button" class="btn secondary" id="disconnectPollinations" style="width:auto;margin:0;display:none;">Disconnect</button>
            </div>
            <div id="pollinationsStatus" class="status">Not connected — connect your Pollinations account to use your own Pollen.</div>
          </div>
        </div>
        <div class="field" style="grid-column: span 2;">
          <label>📝 Text Prompt (Προαιρετικό - αναλύεται αυτόματα)</label>
          <textarea id="prompt" rows="2" placeholder="π.χ. dark techno at 132 bpm in F minor, 8 bars..."></textarea>
        </div>
      </div>

      <div class="grid" style="margin-top: 1rem;">
        <div class="field">
          <label>🎵 Style</label>
          <select id="style">
            <option value="house">House</option><option value="techno">Techno</option><option value="trance">Trance</option>
            <option value="hip-hop">Hip-Hop</option><option value="jazz">Jazz</option><option value="cinematic">Cinematic</option>
            <option value="ambient">Ambient</option><option value="rock">Rock</option><option value="synthwave">Synthwave</option>
            <option value="disco">Disco</option><option value="afrobeats">Afrobeats</option><option value="pop">Pop</option>
            <option value="latin">Latin</option><option value="drum-and-bass">Drum & Bass</option>
          </select>
        </div>
        <div class="field">
          <label>🌙 Mood</label>
          <select id="mood">
            <option value="neutral">Neutral</option><option value="dark">Dark</option><option value="dreamy">Dreamy</option>
            <option value="uplifting">Uplifting</option><option value="mysterious">Mysterious</option><option value="groovy">Groovy</option>
            <option value="energetic">Energetic</option><option value="melancholic">Melancholic</option><option value="peaceful">Peaceful</option>
            <option value="aggressive">Aggressive</option><option value="romantic">Romantic</option>
          </select>
        </div>
        <div class="field">
          <label>🔑 Key</label>
          <select id="key">
            <option value="C">C</option><option value="C#">C#</option><option value="Db">Db</option><option value="D">D</option>
            <option value="D#">D#</option><option value="Eb">Eb</option><option value="E">E</option><option value="F">F</option>
            <option value="F#">F#</option><option value="Gb">Gb</option><option value="G">G</option><option value="G#">G#</option>
            <option value="Ab">Ab</option><option value="A">A</option><option value="A#">A#</option><option value="Bb">Bb</option><option value="B">B</option>
          </select>
        </div>
        <div class="field">
          <label>📐 Scale</label>
          <select id="scale">
            <option value="minor">Minor</option><option value="major">Major</option><option value="dorian">Dorian</option>
            <option value="phrygian">Phrygian</option><option value="pentatonic">Pentatonic</option><option value="blues">Blues</option>
          </select>
        </div>
        <div class="field">
          <label>⏱️ Time Signature</label>
          <select id="timeSignature">
            <option value="4/4">4/4</option><option value="3/4">3/4</option><option value="6/8">6/8</option><option value="2/4">2/4</option>
          </select>
        </div>
        <div class="field">
          <label>🎚️ Complexity</label>
          <select id="complexity">
            <option value="moderate">Moderate</option><option value="simple">Simple</option><option value="complex">Complex</option>
          </select>
        </div>
        <div class="field">
          <label>⚡ BPM (40-220)</label>
          <input type="number" id="bpm" value="120" min="40" max="220">
        </div>
        <div class="field">
          <label>📏 Bars (1-16)</label>
          <input type="number" id="bars" value="4" min="1" max="16">
        </div>
      </div>

      <div style="margin-top: 1rem;">
        <label>🎛️ Tracks to Generate (Max 6)</label>
        <div class="checkboxes" id="trackContainer">
          <label><input type="checkbox" value="bassline"> <span>Bassline</span></label>
          <label><input type="checkbox" value="chord"> <span>Chord</span></label>
          <label><input type="checkbox" value="melody" checked> <span>Melody</span></label>
          <label><input type="checkbox" value="arpeggio"> <span>Arpeggio</span></label>
          <label><input type="checkbox" value="lead"> <span>Lead</span></label>
          <label><input type="checkbox" value="plucks"> <span>Plucks</span></label>
          <label><input type="checkbox" value="strings"> <span>Strings</span></label>
          <label><input type="checkbox" value="keys"> <span>Keys</span></label>
          <label><input type="checkbox" value="pad-textures"> <span>Pad Textures</span></label>
          <label><input type="checkbox" value="guitar"> <span>Guitar</span></label>
          <label><input type="checkbox" value="brass"> <span>Brass</span></label>
          <label><input type="checkbox" value="percs"> <span>Percussions</span></label>
        </div>
      </div>

      <div style="margin-top: 1rem; display: flex; align-items: center; gap: 1.5rem;">
        <label style="display: flex; align-items: center; gap: 0.5rem;">
          <input type="radio" name="format" value="json" checked> JSON (Stream)
        </label>
        <label style="display: flex; align-items: center; gap: 0.5rem;">
          <input type="radio" name="format" value="midi"> Direct .MID File
        </label>
      </div>

      <div class="actions">
        <button class="btn" id="generateBtn">🚀 GENERATE MIDI</button>
      </div>
      <div id="statusMsg" class="status"></div>
    </div>

    <div class="card">
      <h3>🖥️ API Response</h3>
      <pre id="output">Έτοιμος για την πρώτη κλήση...</pre>
      <a id="dlLink" href="#" download="Generated_Track.mid">Λήψη .MID αρχείου</a>
    </div>
  </div>

  <script>
    // 🛠️ Ρύθμισε εδώ το base URL του deployment σου
    const API_BASE = 'https://midi-aigenerator.vercel.app/api/v1/midi'; 
    const outputEl = document.getElementById('output');
    const statusEl = document.getElementById('statusMsg');
    const dlLink = document.getElementById('dlLink');
    const genBtn = document.getElementById('generateBtn');
    const trackCheckboxes = document.querySelectorAll('#trackContainer input');
    const BYOP_CLIENT_ID = 'pk_2Of5YNHliSnwikUE';
    const BYOP_AUTHORIZE_URL = 'https://enter.pollinations.ai/authorize';
    const POLLINATIONS_TOKEN_KEY = 'byop_pollinations_key';
    const POLLINATIONS_EXPIRY_KEY = 'byop_token_expires_at';
    const OAUTH_VERIFIER_KEY = 'byop_code_verifier';
    const OAUTH_STATE_KEY = 'byop_oauth_state';

    function getPollinationsToken() {
      const token = sessionStorage.getItem(POLLINATIONS_TOKEN_KEY);
      const expiry = Number(sessionStorage.getItem(POLLINATIONS_EXPIRY_KEY) || 0);
      if (token && expiry && Date.now() >= expiry) {
        sessionStorage.removeItem(POLLINATIONS_TOKEN_KEY);
        sessionStorage.removeItem(POLLINATIONS_EXPIRY_KEY);
        return null;
      }
      return token || null;
    }

    function setConnectionUI() {
      const connected = !!getPollinationsToken();
      document.getElementById('pollinationsStatus').textContent = connected
        ? 'Connected — generations use your Pollinations Pollen.'
        : 'Not connected — connect your Pollinations account to use your own Pollen.';
      document.getElementById('pollinationsStatus').className = 'status ' + (connected ? 'success' : '');
      document.getElementById('connectPollinations').style.display = connected ? 'none' : 'inline-block';
      document.getElementById('disconnectPollinations').style.display = connected ? 'inline-block' : 'none';
    }

    function savePlaygroundState() {
      const state = {};
      ['apiKey','prompt','style','mood','key','scale','timeSignature','complexity','bpm','bars'].forEach(id => {
        const el = document.getElementById(id);
        if (el) state[id] = el.value;
      });
      state.trackTypes = Array.from(document.querySelectorAll('#trackContainer input:checked')).map(el => el.value);
      state.format = document.querySelector('input[name="format"]:checked')?.value || 'json';
      sessionStorage.setItem('api_playground_state', JSON.stringify(state));
    }

    function restorePlaygroundState() {
      try {
        const state = JSON.parse(sessionStorage.getItem('api_playground_state') || 'null');
        if (state) {
          Object.entries(state).forEach(([id,value]) => {
            const el = document.getElementById(id);
            if (el && typeof value === 'string') el.value = value;
          });
          if (Array.isArray(state.trackTypes)) {
            document.querySelectorAll('#trackContainer input').forEach(el => el.checked = state.trackTypes.includes(el.value));
          }
          const format = document.querySelector(`input[name="format"][value="${state.format}"]`);
          if (format) format.checked = true;
        }
      } catch { /* ignore malformed saved state */ }
    }

    function base64UrlEncode(buffer) {
      return btoa(String.fromCharCode(...new Uint8Array(buffer))).replace(/\\+/g,'-').replace(/\\//g,'_').replace(/=+$/,'');
    }

    async function connectPollinations() {
      try {
        savePlaygroundState();
        const verifierBytes = crypto.getRandomValues(new Uint8Array(32));
        const verifier = base64UrlEncode(verifierBytes);
        const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
        const challenge = base64UrlEncode(digest);
        const stateBytes = crypto.getRandomValues(new Uint8Array(16));
        const state = base64UrlEncode(stateBytes);
        sessionStorage.setItem(OAUTH_VERIFIER_KEY, verifier);
        sessionStorage.setItem(OAUTH_STATE_KEY, state);
        sessionStorage.setItem('api_playground_oauth_pending','1');
        const redirectUri = window.location.origin + '/';
        const params = new URLSearchParams({
          response_type:'code', client_id:BYOP_CLIENT_ID, redirect_uri:redirectUri,
          scope:'profile usage', state, code_challenge:challenge, code_challenge_method:'S256'
        });
        window.location.href = `${BYOP_AUTHORIZE_URL}?${params.toString()}`;
      } catch (err) {
        document.getElementById('pollinationsStatus').textContent = 'Could not start Pollinations authorization. Please try again.';
        document.getElementById('pollinationsStatus').className = 'status error';
      }
    }

    document.getElementById('connectPollinations').addEventListener('click', connectPollinations);
    document.getElementById('disconnectPollinations').addEventListener('click', () => {
      sessionStorage.removeItem(POLLINATIONS_TOKEN_KEY);
      sessionStorage.removeItem(POLLINATIONS_EXPIRY_KEY);
      setConnectionUI();
    });

    // Περιορισμός σε 6 tracks
    trackCheckboxes.forEach(cb => {
      cb.addEventListener('change', () => {
        const checked = document.querySelectorAll('#trackContainer input:checked').length;
        if (checked > 6) {
          cb.checked = false;
          statusEl.textContent = '⚠️ Μέγιστο 6 tracks επιτρέπονται.';
          statusEl.className = 'status error';
        }
      });
    });

    async function generateMIDI() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const pollinationsKey = getPollinationsToken();
      if (!apiKey.startsWith('mgk_')) {
        statusEl.textContent = '❌ Λείπει ή είναι άκυρο το API Key (πρέπει να ξεκινάει με mgk_)';
        statusEl.className = 'status error'; return;
      }

      if (!pollinationsKey) {
        statusEl.textContent = '❌ Συνδέσου πρώτα με το Pollinations account σου μέσω του κουμπιού Connect Pollinations.';
        statusEl.className = 'status error'; return;
      }

      const prompt = document.getElementById('prompt').value.trim();
      const style = document.getElementById('style').value;
      const mood = document.getElementById('mood').value;
      const key = document.getElementById('key').value;
      const scale = document.getElementById('scale').value;
      const timeSignature = document.getElementById('timeSignature').value;
      const complexity = document.getElementById('complexity').value;
      const bpm = parseInt(document.getElementById('bpm').value) || 120;
      const bars = parseInt(document.getElementById('bars').value) || 4;
      const format = document.querySelector('input[name="format"]:checked').value;
      const trackTypes = Array.from(document.querySelectorAll('#trackContainer input:checked')).map(c => c.value);

      if (trackTypes.length === 0) {
        statusEl.textContent = '⚠️ Επίλεξε τουλάχιστον 1 track type.';
        statusEl.className = 'status error'; return;
      }

      const params = { bpm, bars, key, scale, style, mood, timeSignature, complexity, trackTypes };
      if (prompt) params.prompt = prompt;

      const url = format === 'midi' ? `${API_BASE}?format=midi` : API_BASE;
      const body = { promptParams: params };

      genBtn.disabled = true;
      genBtn.textContent = '⏳ Γίνεται επεξεργασία...';
      statusEl.textContent = '📡 Στέλνω αίτημα...';
      statusEl.className = 'status';
      outputEl.textContent = '';
      dlLink.style.display = 'none';

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`,
            'X-Pollinations-Key': pollinationsKey
          },
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || `HTTP ${res.status}`);
        }

        if (format === 'midi') {
          const buffer = await res.arrayBuffer();
          const blob = new Blob([buffer], { type: 'audio/midi' });
          const urlObj = URL.createObjectURL(blob);
          dlLink.href = urlObj;
          dlLink.download = (params.prompt || 'Generated_Track').replace(/\s+/g, '_') + '.mid';
          dlLink.style.display = 'inline-block';
          statusEl.textContent = '✅ Το αρχείο .mid δημιουργήθηκε επιτυχώς!';
          statusEl.className = 'status success';
        } else {
          // Streaming JSON
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            // Καθαρισμός μερικών συμβόλων markdown αν τα στείλει το LLM
            const clean = buffer.replace(/```json|```/g, '').trim();
            outputEl.textContent = clean;
            outputEl.scrollTop = outputEl.scrollHeight;
          }
          statusEl.textContent = '✅ JSON stream ολοκληρώθηκε.';
          statusEl.className = 'status success';
        }
      } catch (err) {
        statusEl.textContent = `❌ Σφάλμα: ${err.message}`;
        statusEl.className = 'status error';
        outputEl.textContent = err.message;
      } finally {
        genBtn.disabled = false;
        genBtn.textContent = '🚀 GENERATE MIDI';
      }
    }

    document.getElementById('generateBtn').addEventListener('click', generateMIDI);

    restorePlaygroundState();
    setConnectionUI();
    const oauthResult = sessionStorage.getItem('api_playground_oauth_result');
    if (oauthResult) {
      sessionStorage.removeItem('api_playground_oauth_result');
      const messages = {
        connected: 'Pollinations connected successfully. You can now generate with your own Pollen.',
        cancelled: 'Pollinations authorization was cancelled.',
        error: 'Pollinations authorization failed. Please try connecting again.'
      };
      statusEl.textContent = messages[oauthResult] || messages.error;
      statusEl.className = 'status ' + (oauthResult === 'connected' ? 'success' : 'error');
    }
  </script>
</body>
</html>
