<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>MIDI API Developer Playground</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0e1217; color: #ececec; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .box { background: #1c1f26; padding: 20px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px; }
        h2 { margin-top: 0; color: #54B76E; font-size: 1.2rem; }
        label { display: block; margin: 10px 0 5px; font-size: 0.9rem; color: #aaa; }
        input, select, button, textarea { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #333; background: #0e1217; color: white; box-sizing: border-box; }
        button { background: #54B76E; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }
        button:hover { background: #45a05a; }
        #console { background: #000; color: #00ff00; font-family: 'Courier New', Courier, monospace; height: 400px; overflow-y: auto; padding: 10px; font-size: 0.85rem; white-space: pre-wrap; border: 1px solid #444; }
        .status { font-size: 0.8rem; padding: 5px; margin-top: 10px; border-radius: 3px; display: none; }
        .success { background: rgba(84, 183, 110, 0.2); color: #54B76E; }
    </style>
</head>
<body>

<h1>🛠️ MIDI API Playground</h1>
<p>Δοκίμασε το API σου σε πραγματικό χρόνο.</p>

<div class="container">
    <div class="sidebar">
        <div class="box">
            <h2>1. Απόκτηση Κλειδιού</h2>
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="developer@example.com">
            <button onclick="register()">Εγγραφή & Λήψη Key</button>
            <div id="regStatus" class="status"></div>
        </div>

        <div class="box">
            <h2>2. Authentication</h2>
            <label>Το API Key σου</label>
            <input type="text" id="apiKey" placeholder="mgk_...">
            <button style="background: #333;" onclick="validate()">Έλεγχος Credits</button>
            <div id="valStatus" class="status"></div>
        </div>
    </div>

    <div class="main">
        <div class="box">
            <h2>3. Generate MIDI (POST /api/v1/midi)</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label>Style</label>
                    <select id="style">
                        <option value="techno">Techno</option>
                        <option value="house">House</option>
                        <option value="ambient">Ambient</option>
                        <option value="trap">Trap</option>
                    </select>
                </div>
                <div>
                    <label>Mood</label>
                    <input type="text" id="mood" value="dark and industrial">
                </div>
                <div>
                    <label>BPM</label>
                    <input type="number" id="bpm" value="128">
                </div>
                <div>
                    <label>Bars</label>
                    <input type="number" id="bars" value="4">
                </div>
            </div>
            <button onclick="generate()">Κλήση API (Stream)</button>
        </div>

        <div class="box">
            <h2>Response Console</h2>
            <div id="console">Αναμονή για κλήση...</div>
        </div>
    </div>
</div>

<script>
    const log = (msg, isError = false) => {
        const cons = document.getElementById('console');
        if (cons.innerHTML === 'Αναμονή για κλήση...') cons.innerHTML = '';
        const timestamp = new Date().toLocaleTimeString();
        cons.innerHTML += `<span style="color: ${isError ? '#ff4444' : '#888'}">[${timestamp}]</span> ${msg}\n`;
        cons.scrollTop = cons.scrollHeight;
    };

    // --- 1. Register API Key ---
    async function register() {
        const email = document.getElementById('regEmail').value;
        const status = document.getElementById('regStatus');
        
        try {
            const res = await fetch('/api/v1/keys/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            
            if (res.ok) {
                document.getElementById('apiKey').value = data.key;
                status.className = 'status success';
                status.style.display = 'block';
                status.innerText = 'Το κλειδί δημιουργήθηκε!';
                log(`Κλειδί εκδόθηκε για: ${email}`);
            } else {
                alert(data.error);
            }
        } catch (e) {
            log('Σφάλμα κατά την εγγραφή: ' + e.message, true);
        }
    }

    // --- 2. Validate Key ---
    async function validate() {
        const key = document.getElementById('apiKey').value;
        const status = document.getElementById('valStatus');
        
        try {
            const res = await fetch('/api/v1/keys/validate', {
                headers: { 'Authorization': `Bearer ${key}` }
            });
            const data = await res.json();
            
            if (res.ok) {
                status.className = 'status success';
                status.style.display = 'block';
                status.innerText = `Έγκυρο! Credits: ${data.used}/${data.monthlyLimit}`;
                log(`Έλεγχος κλειδιού: ${data.email} (${data.plan})`);
            } else {
                log('Μη έγκυρο κλειδί: ' + data.error, true);
            }
        } catch (e) {
            log('Σφάλμα σύνδεσης: ' + e.message, true);
        }
    }

    // --- 3. Generate MIDI (Streaming) ---
    async function generate() {
        const key = document.getElementById('apiKey').value;
        if (!key) return alert('Βάλε πρώτα το API Key σου!');

        const body = {
            promptParams: {
                style: document.getElementById('style').value,
                mood: document.getElementById('mood').value,
                bpm: parseInt(document.getElementById('bpm').value),
                duration_bars: parseInt(document.getElementById('bars').value),
                trackTypes: ['bassline', 'melody']
            }
        };

        log('Ξεκινάει η παραγωγή... (Streaming JSON)');
        
        try {
            const res = await fetch('/api/v1/midi', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${key}`
                },
                body: JSON.stringify(body)
            });

            if (!res.ok) {
                const err = await res.json();
                log('Σφάλμα API: ' + err.error, true);
                return;
            }

            // Διαχείριση του Stream
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let fullText = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value);
                fullText += chunk;
                // Ενημέρωση της κονσόλας σε πραγματικό χρόνο
                document.getElementById('console').innerText = fullText;
            }
            
            log('\nΗ παραγωγή ολοκληρώθηκε!');
            
        } catch (e) {
            log('Fatal Error: ' + e.message, true);
        }
    }
</script>

</body>
</html>
