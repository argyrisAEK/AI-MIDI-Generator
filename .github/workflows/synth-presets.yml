name: Audio and Musical Regression Tests

on:
  pull_request:
    paths:
      - 'index.html'
      - 'api/analyze.js'
      - 'js/main.js'
      - 'js/prompt-analyzer.js'
      - 'lib/track-intent.mjs'
      - 'tests/track-intent.test.mjs'
      - 'js/main.js'
      - 'js/prompt-analyzer.js'
      - 'lib/track-intent.mjs'
      - 'tests/track-intent.test.mjs'
      - 'api/generate.mjs'
      - 'lib/subgenre-profiles.mjs'
      - 'tests/subgenre-profiles.test.mjs'
      - 'js/audio-renderer.js'
      - 'js/audio.js'
      - 'lib/preview-audio-config.mjs'
      - 'tests/preview-audio-config.test.mjs'
      - 'lib/audio-events.mjs'
      - 'lib/audio-polyphony.mjs'
      - 'tests/audio-polyphony.test.mjs'
      - 'tests/audio-renderer-events.test.mjs'
      - 'lib/percussion-mapping.mjs'
      - 'tests/percussion-mapping.test.mjs'
      - 'lib/percussion-profiles.mjs'
      - 'tests/percussion-profiles.test.mjs'
      - 'lib/stereo-metrics.mjs'
      - 'tests/stereo-metrics.test.mjs'
      - 'lib/musical-diagnostics.mjs'
      - 'tests/musical-diagnostics.test.mjs'
      - '.github/workflows/synth-presets.yml'
  push:
    branches: [main]
    paths:
      - 'api/analyze.js'
      - 'api/generate.mjs'
      - 'lib/subgenre-profiles.mjs'
      - 'tests/subgenre-profiles.test.mjs'
      - 'js/audio-renderer.js'
      - 'js/audio.js'
      - 'lib/preview-audio-config.mjs'
      - 'tests/preview-audio-config.test.mjs'
      - 'lib/audio-events.mjs'
      - 'lib/audio-polyphony.mjs'
      - 'tests/audio-renderer-events.test.mjs'
      - 'tests/audio-polyphony.test.mjs'
      - 'lib/percussion-mapping.mjs'
      - 'tests/percussion-mapping.test.mjs'
      - 'lib/percussion-profiles.mjs'
      - 'tests/percussion-profiles.test.mjs'
      - 'lib/stereo-metrics.mjs'
      - 'tests/stereo-metrics.test.mjs'
      - '.github/workflows/synth-presets.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Describe track intent regression tests
        run: node --test tests/track-intent.test.mjs
      - name: Run shared preview audio configuration tests
        run: node tests/preview-audio-config.test.mjs
      - name: Run shared subgenre registry tests
        run: node tests/subgenre-profiles.test.mjs
      - name: Run audio renderer event scheduling tests
        run: node tests/audio-renderer-events.test.mjs
      - name: Run export polyphony tests
        run: node tests/audio-polyphony.test.mjs
      - name: Run percussion pitch mapping tests
        run: node tests/percussion-mapping.test.mjs
      - name: Run deterministic genre percussion profile tests
        run: node tests/percussion-profiles.test.mjs
      - name: Run stereo image measurement tests
        run: node tests/stereo-metrics.test.mjs
      - name: Run read-only musical diagnostics tests
        run: node tests/musical-diagnostics.test.mjs
