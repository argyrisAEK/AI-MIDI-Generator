<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI MIDI Generator</title>
    <meta name="description" content="Describe your music using text, selecting from example genres, or using a form-based input">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header-image">
            <div class="header-content">
                <h1>AI MIDI Generator</h1>
                   <p class="subtitle">Compose unique MIDI melodies and multi-track arrangements with the help of AI</p>
            </div>
        </header>
        
        <div class="card">
            <div class="tabs">
                <button id="text-tab" class="tab-btn active" data-tab="text">Text Prompt</button>
                <button id="form-tab" class="tab-btn" data-tab="form">Form</button>
                <button id="examples-tab" class="tab-btn" data-tab="examples">Examples</button>
            </div>

            <div class="tab-content">
                <div id="text-panel" class="tab-panel active">
                    <div class="control-group">
                        <label for="text-prompt">Describe your MIDI</label>
                        <textarea id="text-prompt" class="form-control" rows="4" placeholder="e.g., 'A dreamy, ambient pad progression in C Minor with a slow, hypnotic arpeggio on top, at 90 BPM'" aria-label="Text Prompt"></textarea>
                    </div>
                </div>

                <div id="examples-panel" class="tab-panel">
                    <p>Click an example to populate the text prompt with a creative starting point.</p>
                    <div id="examples-grid" class="examples-grid">
                         <button class="example-btn" data-prompt="An uplifting Deep House track at 124 BPM in A major, featuring a groovy bassline, warm electric piano chords, and a catchy lead synth melody with moderate rhythmic complexity. Includes smooth string sections and subtle plucks. 8 bars long with a verse structure.">Deep House</button>
                       
                         <button class="example-btn" data-prompt="A classic Disco track at 120 BPM in E major with an uplifting and groovy mood. Features a funky, octave-jumping bassline, four-on-the-floor drums, rhythmic guitar chords, classic string stabs, and a section melody. 8 bars long with a chorus structure.">Classic Disco</button>
                         <button class="example-btn" data-prompt="An energetic Drum & Bass track at 154 BPM in F minor. Features a complex, rolling breakbeat, a deep and distorted reese bassline, atmospheric pad, and a simple, catchy synth lead. 8 bars long with a drop structure.">Drum & Bass</button>
                         <button class="example-btn" data-prompt="A nostalgic Synthwave track at 110 BPM in G minor with a dreamy mood. Combines driving bass arpeggios, warm analog pad, and a hooky lead synth melody with simple rhythmic patterns. Includes atmospheric strings. 8 bars long with an intro structure.">Synthwave</button>
                         <button class="example-btn" data-prompt="A relaxed Downtempo piece at 95 BPM in C major with a chill mood. Features deep sub-bass, smooth electric piano chords, atmospheric pads, and subtle plucks with simple rhythmic complexity. 8 bars long.">Downtempo Chill</button>
                         <button class="example-btn" data-prompt="An energetic Rock anthem at 130 BPM in E major with a powerful mood. Includes driving guitar riffs, solid bassline, and energetic drum patterns with moderate rhythmic complexity. 8 bars long with a verse structure.">Rock Anthem</button>
                         <button class="example-btn" data-prompt="A complex Progressive Rock arrangement at 120 BPM in D minor with a melancholic mood. Features intricate guitar leads, keyboard sections, syncopated bass parts, and unconventional drum patterns with complex rhythmic structures. 16 bars long.">Progressive Rock</button>
                         <button class="example-btn" data-prompt="A soulful Hip-Hop groove at 90 BPM in A minor with a relaxed mood. Built around mellow electric piano chords, smooth bassline, and head-nodding drum patterns with simple rhythmic complexity. 8 bars long.">Hip-Hop Soul</button>
                         <button class="example-btn" data-prompt="A deep, atmospheric Ambient piece at 70 BPM in F major with a dreamy mood. Composed of evolving pad textures, subtle string sections, and delicate plucks with simple rhythmic patterns. No drums for a spacious feel. 32 bars long.">Ambient Soundscape</button>
                       
                         <button class="example-btn" data-prompt="A sophisticated Jazz composition at 120 BPM in C major with a relaxed mood. Includes complex chord progressions on keys, walking bassline, and intricate drum patterns with complex rhythmic structures. 16 bars long with a bridge structure.">Jazz Standard</button>
                    </div>
                </div>

                <div id="form-panel" class="tab-panel">
                    <div id="form-fields-container">
                        <div class="form-section">
                            <h3 class="form-section-header">Track Composition</h3>
                            <div class="control-group">
                                <label for="track-types">Track Types (up to 4)</label>
                                <div class="checkbox-group" id="track-types">
                                    <div class="checkbox-item">
                                        <input type="checkbox" id="bassline-track" name="track-type" value="bassline" checked>
                                        <label for="bassline-track">Bassline</label>
                                    </div>
                                    <div class="checkbox-item">
                                        <input type="checkbox" id="melody-track" name="track-type" value="melody">
                                        <label for="melody-track">Melody</label>
                                    </div>
                                    <div class="checkbox-item">
                                        <input type="checkbox" id="chord-track" name="track-type" value="chord">
                                        <label for="chord-track">Pad/Chord</label>
                                    </div>
                                    <div class="checkbox-item">
                                        <input type="checkbox" id="arpeggio-track" name="track-type" value="arpeggio">
                                        <label for="arpeggio-track">Arpeggio</label>
                                    </div>
                                    <div class="checkbox-item">
                                        <input type="checkbox" id="strings-track" name="track-type" value="strings">
                                        <label for="strings-track">Strings</label>
                                    </div>
                                    <div class="checkbox-item">
                                        <input type="checkbox" id="lead-track" name="track-type" value="lead">
                                        <label for="lead-track">Lead</label>
                                    </div>
                                    <div class="checkbox-item">
                                        <input type="checkbox" id="plucks-track" name="track-type" value="plucks">
                                        <label for="plucks-track">Plucks</label>
                                    </div>
                                    <div class="checkbox-item">
                                        <input type="checkbox" id="drums-track" name="track-type" value="drums">
                                        <label for="drums-track">Drums</label>
                                    </div>
                                    <div class="checkbox-item">
                                        <input type="checkbox" id="keys-track" name="track-type" value="keys">
                                        <label for="keys-track">Keys/Piano</label>
                                    </div>
                                    <div class="checkbox-item">
                                        <input type="checkbox" id="brass-track" name="track-type" value="brass">
                                        <label for="brass-track">Brass</label>
                                    </div>
                                    <div class="checkbox-item">
                                        <input type="checkbox" id="guitar-track" name="track-type" value="guitar">
                                        <label for="guitar-track">Guitar</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-section">
                            <h3 class="form-section-header">Musical Properties</h3>
                            <div class="options-grid">
                                <div class="control-group">
                                    <label for="style">Style/Genre</label>
                                    <select id="style" class="form-control" aria-label="Style/Genre">
                                        <option value="house" selected>House</option>
                                        <option value="techno">Techno</option>
                                        <option value="trance">Trance</option>
                                        <option value="trap">Trap</option>
                                        <option value="hip-hop">Hip-Hop</option>
                                        <option value="rock">Rock</option>
                                        <option value="pop">Pop</option>
                                        <option value="funk">Funk</option>
                                        <option value="jazz">Jazz</option>
                                        <option value="disco">Disco</option>
                                        <option value="classical">Classical</option>
                                        <option value="ambient">Ambient</option>
                                        <option value="drum-and-bass">Drum & Bass</option>
                                        <option value="synthwave">Synthwave</option>
                                        <option value="downtempo">Downtempo</option>
                                        <option value="progressive-rock">Progressive Rock</option>
                                    </select>
                                </div>

                                <div class="control-group">
                                    <label for="key">Key</label>
                                    <select id="key" class="form-control" aria-label="Key">
                                        <option value="C" selected>C</option>
                                        <option value="C#">C# / Db</option>
                                        <option value="D">D</option>
                                        <option value="D#">D# / Eb</option>
                                        <option value="E">E</option>
                                        <option value="F">F</option>
                                        <option value="F#">F# / Gb</option>
                                        <option value="G">G</option>
                                        <option value="G#">G# / Ab</option>
                                        <option value="A">A</option>
                                        <option value="A#">A# / Bb</option>
                                        <option value="B">B</option>
                                    </select>
                                </div>

                                <div class="control-group">
                                    <label for="scale-type">Scale Type</label>
                                    <select id="scale-type" class="form-control" aria-label="Scale Type">
                                        <option value="major" selected>Major</option>
                                        <option value="minor">Minor</option>
                                        <option value="pentatonic">Pentatonic</option>
                                        <option value="blues">Blues</option>
                                    </select>
                                </div>

                                <div class="control-group">
                                    <label for="mood">Mood</label>
                                    <select id="mood" class="form-control" aria-label="Mood">
                                        <option value="uplifting">Uplifting</option>
                                        <option value="dark">Dark</option>
                                        <option value="relaxed">Relaxed</option>
                                        <option value="energetic">Energetic</option>
                                        <option value="melancholic">Melancholic</option>
                                        <option value="aggressive">Aggressive</option>
                                        <option value="dreamy">Dreamy</option>
                                        <option value="happy">Happy</option>
                                    </select>
                                </div>

                                <div class="control-group">
                                    <label for="bpm">BPM</label>
                                    <input type="number" id="bpm" name="bpm" value="120" min="60" max="200" class="form-control" aria-label="BPM">
                                </div>

                                <div class="control-group">
                                    <label for="rhythmic-complexity">Rhythmic Complexity</label>
                                    <select id="rhythmic-complexity" class="form-control" aria-label="Rhythmic Complexity">
                                        <option value="simple" selected>Simple</option>
                                        <option value="moderate">Moderate</option>
                                        <option value="complex">Complex</option>
                                    </select>
                                </div>

                                <div class="control-group">
                                    <label for="duration">Duration (Bars)</label>
                                    <select id="duration" class="form-control" aria-label="Duration (Bars)">
                                        <option value="4" selected>4</option>
                                        <option value="8">8</option>
                                        <option value="16">16</option>
                                        <option value="32">32</option>
                                    </select>
                                </div>

                                <div class="control-group">
                                    <label for="time-signature">Time Signature</label>
                                    <select id="time-signature" class="form-control" aria-label="Time Signature">
                                        <option value="4/4">4/4</option>
                                        <option value="3/4">3/4</option>
                                        <option value="6/8">6/8</option>
                                        <option value="5/4">5/4</option>
                                        <option value="7/8">7/8</option>
                                    </select>
                                </div>

                                <div class="control-group">
                                    <label for="structure">Structure (Optional)</label>
                                    <select id="structure" class="form-control" aria-label="Structure">
                                        <option value="" selected>None</option>
                                        <option value="intro">Intro</option>
                                        <option value="build">Build-up</option>
                                        <option value="verse">Verse</option>
                                        <option value="chorus">Chorus</option>
                                        <option value="bridge">Bridge</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button id="generate" class="btn btn-primary" aria-label="Generate MIDI">Generate MIDI</button>
        <div id="status-container"></div>
        
        <div class="card composition-card">
            <h2 class="card-title">Composition</h2>
            <div id="track-metadata" class="track-metadata"></div>
            <div id="player-controls">
                <div class="track-selection" id="track-selection"></div>
                <div id="transport-controls">
                    <button id="play" class="btn btn-secondary" disabled aria-label="Play MIDI">Play</button>
                    <button id="stop" class="btn btn-secondary" disabled aria-label="Stop MIDI">Stop</button>
                    <button id="download" class="btn btn-secondary" disabled aria-label="Download MIDI">Download</button>
                    <button id="reset" class="btn btn-secondary reset" aria-label="Reset Application">Reset</button>
                </div>
            </div>
        </div>

        <div class="card visualization-card">
            <h2 class="card-title">Visualization</h2>
            <div id="visualizer" class="visualization"></div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "tone": "https://cdn.skypack.dev/tone@14.7.77",
            "@tonejs/midi": "https://esm.sh/@tonejs/midi@2.0.28"
        }
    }
    </script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
