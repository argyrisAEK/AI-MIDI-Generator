<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI Generator with text.pollinations and midijourney</title>
    <meta name="description" content="Create MIDI melodies and sequences using AI with text prompts or form fields">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header-image">
            <div class="header-content">
                <h1>AI MIDI Generator</h1>
                <p class="subtitle">Craft melodies and multi-track sequences from your imagination</p>
            </div>
        </header>
        
        <div class="card">
            <div class="generation-mode">
                <label>How do you want to create your MIDI?</label>
                <div class="mode-selector">
                    <button id="text-mode" class="mode-btn active" aria-label="Text Prompt Mode">Text Prompt</button>
                    <span class="separator-text">or</span>
                    <button id="form-mode" class="mode-btn" aria-label="Form Fields Mode">Form Fields</button>
                </div>
            </div>

            <div id="text-prompt-container" class="generation-interface active">
                <div class="control-group">
                    <label for="text-prompt">Describe your MIDI</label>
                    <textarea id="text-prompt" class="form-control" rows="4" placeholder="e.g., 'A dreamy, ambient pad progression in C Minor with a slow, hypnotic arpeggio on top, at 90 BPM'" aria-label="Text Prompt"></textarea>
                </div>
            </div>

            <div id="form-fields-container" class="generation-interface">
                <div class="form-section">
                    <h3 class="form-section-header">Track Composition</h3>
                    <div class="control-group">
                        <label for="track-types">Track Types (up to 4)</label>
                        <div class="checkbox-group" id="track-types">
                            <div class="checkbox-item">
                                <input type="checkbox" id="bassline-track" name="track-type" value="bassline" checked>
                                <label for="bassline-track">Bassline</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="melody-track" name="track-type" value="melody">
                                <label for="melody-track">Melody</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="chord-track" name="track-type" value="chord">
                                <label for="chord-track">Pad/Chord</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="arpeggio-track" name="track-type" value="arpeggio">
                                <label for="arpeggio-track">Arpeggio</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="strings-track" name="track-type" value="strings">
                                <label for="strings-track">Strings</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="lead-track" name="track-type" value="lead">
                                <label for="lead-track">Lead</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="plucks-track" name="track-type" value="plucks">
                                <label for="plucks-track">Plucks</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="drums-track" name="track-type" value="drums">
                                <label for="drums-track">Drums</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3 class="form-section-header">Musical Properties</h3>
                    <div class="options-grid">
                        <div class="control-group">
                            <label for="style">Style/Genre</label>
                            <select id="style" class="form-control" aria-label="Style/Genre">
                                <option value="house" selected>House</option>
                                <option value="techno">Techno</option>
                                <option value="trap">Trap</option>
                                <option value="hip-hop">Hip-Hop</option>
                                <option value="rock">Rock</option>
                                <option value="pop">Pop</option>
                                <option value="funk">Funk</option>
                                <option value="reggae">Reggae</option>
                                <option value="jazz">Jazz</option>
                                <option value="disco">Disco</option>
                                <option value="classical">Classical</option>
                                <option value="ambient">Ambient</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label for="mood">Mood</label>
                            <select id="mood" class="form-control" aria-label="Mood">
                                <option value="uplifting">Uplifting</option>
                                <option value="dark">Dark</option>
                                <option value="relaxed">Relaxed</option>
                                <option value="energetic">Energetic</option>
                                <option value="melancholic">Melancholic</option>
                                <option value="aggressive">Aggressive</option>
                                <option value="dreamy">Dreamy</option>
                                <option value="happy">Happy</option>
                            </select>
                        </div>
                        
                        <div class="control-group">
                            <label for="key">Key</label>
                            <select id="key" class="form-control" aria-label="Key">
                                <option value="C">C Major</option>
                                <option value="Cm">C Minor</option>
                                <option value="D">D Major</option>
                                <option value="Dm">D Minor</option>
                                <option value="E">E Major</option>
                                <option value="Em">E Minor</option>
                                <option value="F">F Major</option>
                                <option value="Fm">F Minor</option>
                                <option value="G">G Major</option>
                                <option value="Gm">G Minor</option>
                                <option value="A">A Major</option>
                                <option value="Am">A Minor</option>
                                <option value="B">B Major</option>
                                <option value="Bm">B Minor</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label for="bpm">BPM</label>
                            <input type="number" id="bpm" value="120" min="60" max="200" class="form-control" aria-label="BPM">
                        </div>

                        <div class="control-group">
                            <label for="duration">Duration (Bars)</label>
                            <input type="number" id="duration" value="4" min="1" max="8" class="form-control" aria-label="Duration (Bars)">
                        </div>

                        <div class="control-group">
                            <label for="time-signature">Time Signature</label>
                            <select id="time-signature" class="form-control" aria-label="Time Signature">
                                <option value="4/4">4/4</option>
                                <option value="3/4">3/4</option>
                                <option value="6/8">6/8</option>
                                <option value="5/4">5/4</option>
                                <option value="7/8">7/8</option>
                            </select>
                        </div>
                    </div>
                </div>

                 <div class="form-section">
                    <h3 class="form-section-header">Advanced Details</h3>
                     <div class="options-grid">
                        <div class="control-group">
                            <label for="scale-type">Scale Type</label>
                            <select id="scale-type" class="form-control" aria-label="Scale Type">
                                <option value="major">Major</option>
                                <option value="natural-minor">Natural Minor</option>
                                <option value="harmonic-minor">Harmonic Minor</option>
                                <option value="melodic-minor">Melodic Minor</option>
                                <option value="pentatonic-major">Major Pentatonic</option>
                                <option value="pentatonic-minor">Minor Pentatonic</option>
                                <option value="blues">Blues</option>
                                <option value="dorian">Dorian Mode</option>
                                <option value="phrygian">Phrygian Mode</option>
                                <option value="lydian">Lydian Mode</option>
                                <option value="mixolydian">Mixolydian Mode</option>
                                <option value="locrian">Locrian Mode</option>
                                <option value="chromatic">Chromatic</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label for="rhythmic-complexity">Rhythmic Complexity</label>
                            <select id="rhythmic-complexity" class="form-control" aria-label="Rhythmic Complexity">
                                <option value="simple">Simple</option>
                                <option value="moderate" selected="">Moderate</option>
                                <option value="complex">Complex</option>
                                <option value="polyrhythmic">Polyrhythmic</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label for="play-mode">Play Mode</label>
                            <select id="play-mode" class="form-control" aria-label="Play Mode">
                                <option value="loop">Loop</option>
                                <option value="single">Single Play</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button id="generate" class="btn btn-primary" aria-label="Generate MIDI">Generate MIDI</button>
        <div id="status-container"></div>
        
        <div class="card player-card">
            <div class="player-container">
                <div id="track-metadata" class="track-metadata"></div>
                <div id="visualizer" class="visualization"></div>
                <div id="player-controls">
                    <div class="track-selection" id="track-selection"></div>
                    <div id="transport-controls">
                        <button id="play" class="btn btn-secondary" disabled aria-label="Play MIDI">Play</button>
                        <button id="stop" class="btn btn-secondary" disabled aria-label="Stop MIDI">Stop</button>
                        <button id="download" class="btn btn-secondary" disabled aria-label="Download MIDI">Download</button>
                        <button id="reset" class="btn btn-secondary reset" aria-label="Reset Application">Reset</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "tone": "https://cdn.skypack.dev/tone@14.7.77",
            "@tonejs/midi": "https://esm.sh/@tonejs/midi@2.0.28"
        }
    }
    </script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
